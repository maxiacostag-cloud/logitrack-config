# shipment-service · perfil prod: todo corre en Docker Compose y se habla por nombre de servicio.
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8065/eureka/
  instance:
    prefer-ip-address: true

spring:
  datasource:
    url: jdbc:mysql://mysql-shipment:3306/logitrack_shipments?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
  jpa:
    show-sql: false

logging:
  level:
    ar.edu.unju.fi.logitrack: INFO

info:
  app:
    ambiente: prod
