# api-gateway (S3-05): punto único de entrada. Valores que no cambian entre ambientes.
server:
  port: 8066

spring:
  cloud:
    gateway:
      server:
        webflux:
          # CORS (S3-08): se configura una sola vez acá, en el gateway, y no en cada servicio.
          # Los orígenes permitidos se pueden cambiar con la variable CORS_ALLOWED_ORIGINS
          # (varios separados por coma).
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
                allowed-methods: GET,POST,PUT,PATCH,OPTIONS
                allowed-headers: Authorization,Content-Type
                max-age: 3600
          # Las rutas usan el nombre con el que cada servicio se registra en Eureka (lb://).
          # No se reescribe el path: los servicios ya usan estos mismos paths.
          routes:
            - id: security-service
              uri: lb://SECURITY-SERVICE
              predicates:
                - Path=/api/v1/auth/**
            - id: courier-service
              uri: lb://COURIER-SERVICE
              predicates:
                - Path=/api/v1/repartidores/**
            - id: shipment-service
              uri: lb://SHIPMENT-SERVICE
              predicates:
                - Path=/api/v1/envios/**

info:
  app:
    nombre: api-gateway
    descripcion: Punto único de entrada al sistema y enrutamiento hacia los microservicios
