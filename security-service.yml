# security-service: valores que no cambian entre ambientes.

server:
  port: 8083

spring:
  datasource:
    username: ${DB_USER:logitrack}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update

# Duración de los tokens en milisegundos (24 horas). No es un dato sensible.
jwt:
  expiration-ms: 86400000

info:
  app:
    nombre: security-service
    descripcion: Usuarios, autenticación, roles y emisión de JWT

# Usuarios de demo (S4-14): security-service los crea al arrancar solo si llega la contraseña
# por la variable de entorno USUARIOS_DEMO_PASSWORD (en Docker sale del .env de infra).
logitrack:
  usuarios-demo:
    password: ${USUARIOS_DEMO_PASSWORD:}
