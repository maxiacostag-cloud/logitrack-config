# courier-service · perfil dev: la app corre en el IDE y la base en Docker (puerto 3308 de la PC).
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8065/eureka/
  instance:
    prefer-ip-address: true

spring:
  datasource:
    url: jdbc:mysql://localhost:3308/logitrack_couriers?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
  jpa:
    show-sql: true

logging:
  level:
    ar.edu.unju.fi.logitrack: DEBUG

info:
  app:
    ambiente: dev
